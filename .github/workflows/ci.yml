name: CI

on:
  pull_request:
    # `edited` as well: the handoff guard below reads the pull request body, and a
    # corrected body must be able to turn that check green without an empty commit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read
  # status-lint compares the status document against the merged pull requests.
  pull-requests: read
  # issue-label-guard reads the labels of the Issues a pull request links.
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Current GitHub-hosted Ubuntu runner images ship a .NET 9 SDK.
      # Prefer that SDK rather than failing an unrelated LTS runtime download.
      # A missing SDK still installs through the official action and fails closed.
      - name: Check hosted .NET 9 SDK
        id: hosted_dotnet
        shell: bash
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            dotnet --list-sdks
            if dotnet --list-sdks | grep -Eq '^9[.]0[.]'; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v6
        if: steps.hosted_dotnet.outputs.available != 'true'
        with:
          dotnet-version: '9.0.x'
      - name: Require .NET 9 SDK before retained legacy gates
        shell: bash
        run: |
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^9[.]0[.]' || {
            echo "::error::Retained legacy CI requires a .NET 9 SDK"
            exit 1
          }
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      # Report all advisories (#829), including known dev-only debt. Reject HIGH/CRITICAL
      # findings whose lockfile nodes are non-dev or unknown, as well as audit failures.
      # Lockfile dev-only classification does not establish exploitability or acceptance.
      - name: Report and guard npm advisory detail (#829)
        run: python3 scripts/npm_audit_report.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  policy-guard:
    name: policy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove the guard fires on synthetic violations
        run: python -m unittest discover -s scripts/tests -v
      - name: Guard this change
        if: github.event_name == 'pull_request'
        run: python scripts/policy_guard.py --base "origin/${{ github.base_ref }}"

      # Machine-generated pull requests merge without a review run, so their gates live
      # here, inside a check that is already required on every pull request. Adding them
      # to this job rather than a new one keeps branch protection unchanged: a required
      # check that never runs would block every pull request forever.
      #
      # The refs arrive through the environment, not through the expression, because a
      # branch name is attacker-controllable text on a public repository.
      - name: Guard machine-generated pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/machine_pr_guard.py \
            --base "origin/${BASE_REF}" \
            --head-ref "${HEAD_REF}" \
            --head-sha "${HEAD_SHA}"

      # The handoff must name every path the diff touches. Half of the runbook's
      # "declared scope" gate is a predicate over the diff and the body, and a review
      # run was spent on it in #130; this step decides that half, and the reviewer keeps
      # the other — whether the declared set is what the Issue allows. The body arrives
      # through the environment, never through an expression: it is attacker-
      # controllable text on a public repository.
      - name: Guard the handoff against undeclared changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${PR_BODY}" > "${RUNNER_TEMP}/pull-request-body.md"
          python scripts/scope_guard.py \
            --base "origin/${BASE_REF}" \
            --head-ref "${HEAD_REF}" \
            --body-file "${RUNNER_TEMP}/pull-request-body.md"

      # The three label axes on the linked Issue. This was the ACCEPTOR's gate until a
      # run failed it: Issue #448 carried no `area:*` label at all, was claimed,
      # implemented and carried to PR #459, and a review run discovered the missing label
      # there — costing an AUTHOR run, an ACCEPTOR run and a rework round to report one
      # label. Here it costs a re-run (#462). It refuses and names; it never applies the
      # label, which would decide the work's area on the author's behalf.
      #
      # The linked Issues are those a closing keyword in the body names and those GitHub
      # itself links — the sidebar included, which no reading of the body can see (#519).
      # So the step names the pull request, and reads GitHub's answer with
      # `pull-requests: read` and each Issue's labels with `issues: read` (#520). If that
      # answer cannot be read, the body alone decides and the log carries a warning. A link
      # made in the sidebar alone raises no event this workflow listens to; the next run
      # reads it.
      #
      # A pull request that links no Issue passes this step: that gate stays whole in
      # ACCEPTOR_RUNBOOK.md section 2, beside Issue completeness.
      #
      # The body arrives through the environment, never through an expression, for the
      # same reason as the step above; so do the number and the repository, so that the
      # shell line interpolates nothing.
      - name: Guard the label axes of the linked Issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${PR_BODY}" > "${RUNNER_TEMP}/issue-label-guard-body.md"
          python scripts/issue_label_guard.py \
            --repo "${REPOSITORY}" \
            --pull "${PR_NUMBER}" \
            --head-ref "${HEAD_REF}" \
            --body-file "${RUNNER_TEMP}/issue-label-guard-body.md"

      # Offline and unconditional. The rendered table is a function of the ledger and
      # the mirrored registry, so regenerating and comparing catches both a hand-edited
      # table and a ledger row whose author forgot to regenerate. Staleness is a
      # property of the tree, not of a diff, so this runs on push as well.
      - name: Guard the generated coverage table
        run: python scripts/implementation_status.py --check

      # Runs on every event, not only on pull requests: the ledger can go stale because
      # something else merged, without anyone touching it.
      #
      # --self names the pull request being checked. A ledger row is appended by the
      # pull request that earns it, so it cites a number that is still open while the
      # check runs and becomes true at the moment it lands. Every other open citation is
      # still refused. On push there is no pull request and the argument is empty, so
      # every citation must already have merged.
      #
      # --base is what this change is measured against: the base branch of a pull
      # request, the parent of the commit on a push. An identifier the registry gains
      # relative to it may lack its ledger row in this change and in no later one —
      # the one-change bootstrap of #369, computed from the two registries and nothing
      # else. The ref arrives through the environment, as in the guards above.
      - name: Keep the ledger honest about what merged
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          else
            BASE="HEAD^1"
          fi
          python scripts/status_lint.py \
            --repo "${{ github.repository }}" \
            --self "${{ github.event.pull_request.number }}" \
            --base "${BASE}"
