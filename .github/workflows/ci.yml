name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # status-lint compares the status document against the merged pull requests.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  policy-guard:
    name: policy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove the guard fires on synthetic violations
        run: python -m unittest discover -s scripts/tests -v
      - name: Guard this change
        if: github.event_name == 'pull_request'
        run: python scripts/policy_guard.py --base "origin/${{ github.base_ref }}"

      # Runs on every event, not only on pull requests: the status document can go
      # stale because something else merged, without anyone touching the document.
      - name: Keep the status document honest about what merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/status_lint.py --repo "${{ github.repository }}"
