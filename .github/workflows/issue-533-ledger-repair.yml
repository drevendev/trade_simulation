name: Issue 533 ledger repair

on:
  push:
    branches:
      - zen/issue-533-config-006-defaults
    paths:
      - .github/workflows/issue-533-ledger-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zen/issue-533-config-006-defaults
          fetch-depth: 0
      - name: Apply bounded ledger repair
        run: |
          git apply tools/patches/issue-533-ledger-repair.patch
          python scripts/implementation_status.py
          rm tools/patches/issue-533-ledger-repair.patch
          rm .github/workflows/issue-533-ledger-repair.yml
      - name: Commit generated authoritative state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spec/implementation_status.csv docs/spec/IMPLEMENTATION_STATUS.md tools/patches/issue-533-ledger-repair.patch .github/workflows/issue-533-ledger-repair.yml
          git commit -m 'docs: close REQ-CONFIG-006 ledger evidence'
          git push origin HEAD:zen/issue-533-config-006-defaults
