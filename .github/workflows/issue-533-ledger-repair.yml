name: Issue 533 ledger repair

on:
  push:
    branches:
      - zen/issue-533-config-006-defaults
    paths:
      - .github/workflows/issue-533-ledger-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zen/issue-533-config-006-defaults
          fetch-depth: 0
      - name: Apply bounded ledger repair
        run: |
          python - <<'PY'
          from pathlib import Path
          patch = Path('tools/patches/issue-533-ledger-repair.patch').read_text()
          old = next(line[1:] for line in patch.splitlines() if line.startswith('-REQ-CONFIG-006,'))
          new = next(line[1:] for line in patch.splitlines() if line.startswith('+REQ-CONFIG-006,'))
          path = Path('docs/spec/implementation_status.csv')
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old REQ-CONFIG-006 row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          python scripts/implementation_status.py
          rm tools/patches/issue-533-ledger-repair.patch
          rm .github/workflows/issue-533-ledger-repair.yml
      - name: Commit generated authoritative state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close REQ-CONFIG-006 ledger evidence'
          git push origin HEAD:zen/issue-533-config-006-defaults
