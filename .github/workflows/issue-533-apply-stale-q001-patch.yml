name: Issue 533 apply staged Q-001 cleanup

on:
  push:
    branches:
      - zen/issue-533-config-006-defaults

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zen/issue-533-config-006-defaults
          fetch-depth: 0
      - name: Apply exact staged cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patches/issue-533-remove-stale-q001-tests.patch
          git apply --check tools/patches/issue-533-remove-stale-q001-tests.patch
          git apply tools/patches/issue-533-remove-stale-q001-tests.patch
          rm tools/patches/issue-533-remove-stale-q001-tests.patch
          git diff --check
      - name: Commit cleanup to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/validation.test.ts tools/patches/issue-533-remove-stale-q001-tests.patch
          git commit -m 'test: remove stale Q-001 absence assertions'
          git push origin HEAD:zen/issue-533-config-006-defaults
