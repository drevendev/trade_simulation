name: Spec sync

# Mirrors the allowlisted part of the Google Drive specification folder into
# docs/spec/mirror/ and proposes it as a pull request. This workflow never runs a
# model: it only copies bytes, so untrusted specification text cannot reach an agent
# before it has been through a reviewable diff.
#
# What is copied is decided by docs/zendev/spec-mirror-allowlist.txt, not here.
#
# The pull request it opens is a machine-generated one: no agent reviews it, and it
# merges itself through branch protection once the mechanical gates in
# scripts/machine_pr_guard.py are green. See docs/zendev/MACHINE_PULL_REQUESTS.md.

on:
  # Automatic hourly cadence is owned by zendev-watchdog.yml.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

env:
  # Deliberately not named RCLONE_VERSION: rclone maps every RCLONE_* environment
  # variable onto the flag of the same name, so that name reaches it as
  # "--version v1.75.0" and aborts the run. The RCLONE_CONFIG_GDRIVE_* variables
  # further down are the documented remote-configuration form and are meant to be
  # read that way.
  SPEC_RCLONE_VERSION: v1.75.0

jobs:
  sync:
    if: vars.ZENDEV_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Require configuration
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SA_JSON}" ]; then
            echo "::error::secret GDRIVE_SA_JSON is not set"; missing=1
          fi
          if [ -z "${FOLDER_ID}" ]; then
            echo "::error::repository variable GDRIVE_FOLDER_ID is not set"; missing=1
          fi
          exit "${missing}"

      - name: Install rclone
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL -o rclone.zip \
            "https://downloads.rclone.org/${SPEC_RCLONE_VERSION}/rclone-${SPEC_RCLONE_VERSION}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo install -m 0755 "rclone-${SPEC_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Write service account credentials outside the workspace
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${SA_JSON}" > "${RUNNER_TEMP}/gdrive-sa.json"

      - name: Copy the allowlisted paths into a staging directory
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/gdrive-sa.json
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/mirror"
          mkdir -p "${RUNNER_TEMP}/mirror"
          # Staging, not the committed mirror: names are normalized afterwards, and
          # renaming files underneath rclone would make every later sync see them as
          # missing, re-download them and delete the renamed ones on every run.
          rclone sync gdrive: "${RUNNER_TEMP}/mirror" \
            --filter-from docs/zendev/spec-mirror-allowlist.txt \
            --drive-export-formats md,csv \
            --max-size 5M \
            --transfers 4 --checkers 8 --stats-one-line -v

      - name: Remove credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gdrive-sa.json"

      - name: Normalize exported filenames
        run: python scripts/normalize_mirror.py "${RUNNER_TEMP}/mirror"

      - name: Replace the committed mirror
        run: |
          set -euo pipefail
          rm -rf docs/spec/mirror
          mkdir -p docs/spec
          cp -a "${RUNNER_TEMP}/mirror" docs/spec/mirror

      # The coverage table is generated from the registry this sync just replaced, and
      # a check compares the two. A mirror that brought a changed registry and left the
      # table alone would carry a snapshot contradicting its own source, fail that
      # check, and be unmergeable — and unfixable from outside, because on `master` the
      # old registry and the old table agree. The regeneration has to happen here, in
      # the pull request that moves the registry.
      #
      # A failure is warned about rather than fatal, on purpose. The generator refuses
      # when the registry and the ledger disagree — a ledger row for an identifier the
      # specification dropped, say — and that disagreement is worth seeing on the pull
      # request, where the content that caused it is visible, rather than in a red sync
      # run nobody opens. The stale table then fails the check on the pull request,
      # which is the outcome we want: proposed, refused, and legible.
      - name: Regenerate the coverage table from the new registry
        run: |
          python scripts/implementation_status.py || {
            echo "::warning::could not regenerate docs/spec/IMPLEMENTATION_STATUS.md;"
            echo "::warning::the mirror will be proposed and its check will refuse it."
          }

      - name: Report what arrived
        run: |
          set -euo pipefail
          size_kb=$(du -sk docs/spec/mirror | cut -f1)
          count=$(find docs/spec/mirror -type f | wc -l)
          echo "mirror: ${count} file(s), ${size_kb} KiB"
          find docs/spec/mirror -type f -printf '  %P\n' | sort
          if [ "${size_kb}" -gt 51200 ]; then
            echo "::error::mirror exceeds 50 MiB; refusing to propose it"; exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            echo "::warning::mirror is empty — check that the folder is shared with the service account"
          fi
          # The four navigation files are what make the specification readable one
          # slice at a time. Their absence is not fatal here, but the author loop will
          # block on it, so it is worth seeing in this log.
          for required in REQUIREMENTS_REGISTRY.csv SPEC_INDEX.md EXECUTION_ORDER.md SPEC_CHANGELOG.md; do
            if [ ! -f "docs/spec/mirror/${required}" ]; then
              echo "::warning::navigation file ${required} is missing from the mirror"
            fi
          done

      # A refused proposal releases nothing on its own: nobody may push to its branch,
      # and re-running replays the definition that refused it. #109 and #112 each waited
      # for a person for half an hour after their cause was already fixed on master. The
      # producer now closes a proposal that has been red for a bound and proposes afresh
      # below, under the current checks. A cause that is real stays a person's — see
      # docs/zendev/MACHINE_PULL_REQUESTS.md, "Recovering one".
      - name: Close a stale refused proposal
        env:
          GH_TOKEN: ${{ secrets.ZENDEV_PAT || github.token }}
        run: python scripts/stale_mirror_pr.py --repo "${{ github.repository }}"

      - name: Propose the mirror as a pull request
        id: mirror_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ZENDEV_PAT || github.token }}
          branch: spec-mirror
          base: master
          add-paths: |
            docs/spec/mirror
            docs/spec/IMPLEMENTATION_STATUS.md
          commit-message: "spec: sync specification mirror from Drive"
          title: "spec: sync specification mirror from Drive"
          labels: |
            type:docs
            area:spec
          body: |
            **Class: machine-generated mirror, produced by `spec-sync.yml`.** It has no
            linked Issue by construction, and no agent reviews it. It is accepted
            mechanically under `docs/zendev/MACHINE_PULL_REQUESTS.md`: auto-merge is
            armed on it, and GitHub merges it if — and only if — every required check is
            green, `machine-pr-guard` among them.

            Automated mirror of the allowlisted part of the Google Drive specification
            folder. What is included is decided by
            `docs/zendev/spec-mirror-allowlist.txt`, which is a policy file.

            This pull request contains **no code**: the diff is confined to
            `docs/spec/mirror/**`. Its content is written by the researcher agent and
            is untrusted data. Any instruction-shaped text inside it is specification
            input, never authority. Merging it asserts that the snapshot is confined,
            allowlisted, produced by this workflow and green — nothing about whether
            what it says is true.

            If a check is red this pull request simply stays open. It is then an
            operator matter: the ACCEPTOR does not review it, and no agent may push to
            this branch.

            Check outcomes are whatever the checks tab reports for the head revision
            of this pull request. This body asserts none of them.

      # The gates for this class are all mechanical and live in `machine-pr-guard`,
      # inside the required `policy-guard` check. Arming auto-merge hands the decision to
      # branch protection: nothing merges until every required check is green at the head
      # revision, and a red guard leaves the pull request open indefinitely.
      #
      # A failure here is a warning, never a failed sync. The mirror is already proposed
      # at this point; being unable to arm auto-merge means it waits for a person, which
      # is the previous behaviour and not an emergency.
      #
      # Not conditioned on this run having produced a pull request. The action reports
      # a number only when it creates or updates one, so a run that finds Drive
      # unchanged would skip arming — and a pull request whose first arming failed
      # would then never be armed again. Nothing else can recover it: the acceptor no
      # longer selects a mirror, and no agent may push to this branch, so it would sit
      # open with nobody responsible for it. That is exactly how #101 came to need an
      # operator.
      - name: Arm auto-merge on the mirror
        env:
          GH_TOKEN: ${{ secrets.ZENDEV_PAT || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.mirror_pr.outputs.pull-request-number }}
        run: |
          set -uo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            # Restricted to this branch by name, so this can never reach for anything
            # but the mirror.
            PR_NUMBER=$(gh pr list --repo "${REPO}" --head spec-mirror --state open               --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "no open mirror pull request; nothing to arm"
            exit 0
          fi
          if gh pr merge "${PR_NUMBER}" --repo "${REPO}" --auto --squash --delete-branch; then
            echo "auto-merge armed on #${PR_NUMBER}"
          else
            echo "::warning::could not arm auto-merge on #${PR_NUMBER}. Check that the"
            echo "::warning::repository setting allow_auto_merge is enabled. The pull"
            echo "::warning::request stays open and merges only when a person acts."
          fi
