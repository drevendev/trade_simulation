name: ZenDev acceptor

# Independent review of one open pull request per run: accept and merge, or request
# changes. This role never implements. Authoring lives in zendev-author.yml.

on:
  # Automatic hourly cadence is owned by zendev-watchdog.yml.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: zendev-acceptor
  cancel-in-progress: false

jobs:
  acceptor:
    if: vars.ZENDEV_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ZENDEV_PAT || github.token }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Stage the bookkeeper before the model runs, and run the staged copy
      # afterwards. The model checks out other revisions during a run — the ACCEPTOR
      # runbook tells it to, so it can verify a pull request independently — and every
      # step after it would otherwise execute whatever `scripts/` the working tree was
      # left holding. That is how one ledger record came back with no model field: the
      # reviewed branch predated the field, so its copy of this script ran.
      #
      # The token in the recording step makes this more than a bookkeeping bug. A pull
      # request that edited that script would have had its version executed by the
      # reviewing workflow, with the ledger credential in the environment.
      - name: Stage the usage recorder outside the working tree
        run: |
          cp scripts/record_usage.py "${RUNNER_TEMP}/record_usage.py"
          cp scripts/subscription_usage.py "${RUNNER_TEMP}/subscription_usage.py"

      # Section 1 of the runbook is a computation, and running it in the model cost
      # two consecutive runs on one ineligible pull request while three others went
      # unreviewed. It happens here instead, and when nothing is eligible the model
      # is never started — the run ends having spent nothing, which is the correct
      # outcome for a loop with no work.
      - name: Choose the pull request to review
        id: select
        env:
          GH_TOKEN: ${{ secrets.ZENDEV_PAT || github.token }}
        run: python scripts/select_review_target.py --repo "${{ github.repository }}"

      # The subscription is metered in rolling windows, not dollars. One reading before
      # the model and one after; the recorder writes the difference to the private
      # ledger. Only when a model run is about to happen: a run with no work spends
      # nothing and needs no reading. The token reaches this step and the model step
      # only, and the reading never prints what it read.
      - name: Read the subscription windows before the model runs
        if: steps.select.outputs.target != 'none'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python "${RUNNER_TEMP}/subscription_usage.py" --out "${RUNNER_TEMP}/usage-before.json"

      - name: Review one pull request
        id: claude
        if: steps.select.outputs.target != 'none'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ZENDEV_PAT }}
          # The dispatcher runs this workflow with the repository's own GITHUB_TOKEN,
          # so the triggering actor is github-actions[bot]. The action refuses a bot
          # actor unless it is named here, which is why every watchdog-dispatched run
          # failed before the model was even reached.
          #
          # Exactly this bot, never "*": on a public repository "*" would let any
          # external app invoke this action with a prompt it controls.
          allowed_bots: "github-actions"
          # Pinned deliberately. Left unset, the action runs whatever it defaults to
          # today, which can change under an unattended loop with no signal but the
          # bill. The model is part of what governs a run, so it is declared here and
          # recorded in the telemetry ledger for every run.
          #
          # Circuit breaker, not a budget: expected acceptor spend on this model is
          # well under a dollar, so this only fires on a genuine runaway. A hard stop
          # here is ungraceful — the run cannot report its own blocker — which is why
          # the ceiling is generous rather than tight.
          claude_args: --model claude-haiku-4-5 --max-budget-usd 2.00
          settings: |
            {
              "permissions": {
                "allow": ["Bash", "Read", "Glob", "Grep", "TodoWrite"]
              }
            }
          prompt: |
            You are the ACCEPTOR role of an unattended ZenDev run on
            drevendev/trade_simulation. You have no memory of previous runs.

            Read AGENTS.md and then docs/zendev/ACCEPTOR_RUNBOOK.md, and follow the
            runbook exactly, in order, from section 1 to the end.

            Review pull request #${{ steps.select.outputs.target }}. Section 1 of the
            runbook has already been evaluated mechanically and selected it, so do not
            re-run selection and do not review any other pull request. Selection is
            not acceptance: every refusal, verification and merge gate in the runbook
            still applies to this one in full.

            Non-negotiable for this run:
            - Review exactly one pull request, reach one verdict, then stop.
            - Post the verdict once, as the last thing you do, naming the head
              revision it judges. If a later check changes your answer, the earlier
              verdict is already standing and the AUTHOR will read both.
            - You never implement and never push commits to a pull request branch. If
              code must change, request changes and stop.
            - Merge only after you have observed every required check green at the
              current head revision yourself. pending, skipped, neutral and unknown
              are not green. Do not take the pull request body's word for anything.
            - Never merge a change to .github/workflows/**, AGENTS.md or
              docs/zendev/** that widens what agents may do. Label it
              status:needs-decision and stop; a human accepts that class of change.
            - If you cannot decide, name the exact gate in a comment and leave the
              pull request open. Never merge to clear a queue.

      - name: Read the subscription windows after the model ran
        if: always() && steps.select.outputs.target != 'none'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python "${RUNNER_TEMP}/subscription_usage.py" --out "${RUNNER_TEMP}/usage-after.json"

      # Telemetry only. See the note in zendev-author.yml: this never fails the run.
      - name: Record what this run consumed
        if: always()
        env:
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_PAT }}
        run: |
          python "${RUNNER_TEMP}/record_usage.py" \
            --execution-file "${{ steps.claude.outputs.execution_file }}" \
            --conclusion "${{ steps.select.outputs.target == 'none' && 'no_work' || steps.claude.outputs.conclusion }}" \
            --role acceptor \
            --ledger-repo drevendev/zen-telemetry \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --usage-before "${RUNNER_TEMP}/usage-before.json" \
            --usage-after "${RUNNER_TEMP}/usage-after.json"
