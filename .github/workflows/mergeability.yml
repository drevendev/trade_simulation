name: Mergeability

# A pull request stops merging when its base moves, and GitHub does not re-run that
# pull request's checks when `master` advances. So this also runs on pushes, fanning
# out over every open pull request.
#
# The fan-out runs on pushes to **any** branch, not only `master`, because of a
# property that cost a review run to discover: a conflicting pull request gets no
# checks at all. GitHub runs `pull_request` workflows against `refs/pull/N/merge`, and
# for a conflicting pull request that ref cannot be built — so no workflow fires, this
# one included. A branch force-pushed into a conflicting state would therefore carry
# stale checks or none, be selected for review as if unmeasured meant clean, and be
# invisible to the AUTHOR's own "failing required check" rule, since there is no
# failing check to see.
#
# A commit status does not need the merge ref, so the fan-out can still mark that head
# red from a push event. That single status is what returns the pull request to the
# author's queue.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
  workflow_dispatch:

# `statuses: write` is the whole grant. This workflow writes one commit status and
# reads pull request metadata; it never checks out a branch's code and never merges.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: mergeability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Named apart from the commit status this job writes, deliberately.
  #
  # Both used to be called `mergeability`, so both appeared in the checks rollup under
  # one name and no reader could tell which of them branch protection was satisfied by.
  # On #126 the job showed `pass` beside the status showing `pending` — the same word
  # reporting two different things about the same revision.
  #
  # `mergeability` is now exactly one thing: the commit status, and the required check.
  # This job is the machinery that writes it, and its own success says only that the
  # machinery ran.
  write-mergeability-status:
    name: write-mergeability-status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prove the classifier fires
        run: python -m unittest discover -s scripts/tests -v

      - name: Status for this pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/mergeability.py --repo "${{ github.repository }}" --pull "${PR_NUMBER}"

      - name: Status for every open pull request, because the base moved
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/mergeability.py --repo "${{ github.repository }}" --all-open
