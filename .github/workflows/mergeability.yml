name: Mergeability

# A pull request stops merging when its base moves, and GitHub does not re-run that
# pull request's checks when `master` advances. So this also runs on pushes to
# `master`, fanning out over every open pull request.
#
# Every run of this workflow executes the definition and the scripts of `master`,
# never those of the branch being judged. That is what `pull_request_target` is for:
# it fires on the same activity as `pull_request` — a pull request opened, reopened,
# pushed to, or marked ready — but runs in the context of the base, so the copy of
# `scripts/mergeability.py` that writes the required status is always the reviewed
# one, and the revision under judgement cannot change what judges it (#495). The
# default checkout of such a run is the base branch, and nothing here checks out or
# executes the pull request's own code — the one rule that makes the trigger safe to
# hold `statuses: write`. `scripts/tests/test_mergeability_trust.py` refuses the edits
# that would undo any of this.
#
# A property that cost a review run to discover: a conflicting pull request gets no
# `pull_request` run at all. GitHub runs those against `refs/pull/N/merge`, and for a
# conflicting pull request that ref cannot be built. `pull_request_target` needs no
# merge ref and fires even then, so a branch force-pushed into a conflicting state is
# still marked red on its own head, and that single status is what returns the pull
# request to the author's queue. The unfiltered `push` trigger that used to provide
# this is gone: it ran the pushed branch's unreviewed copy of the script over every
# open pull request, which is the trust inversion #495 reports.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

# `statuses: write` is the whole grant `github.token` needs: this workflow writes one
# commit status and reads pull request metadata. The two repair steps at the end act as
# the MACHINE app instead, whose own installation permits the push — a workflow token
# with `contents: write` would push without starting any workflow, which is the one
# thing a repaired branch must do.
permissions:
  contents: read
  pull-requests: read
  statuses: write

# One group per pull request and one for `master`. A `pull_request_target` run's
# `github.ref` is the base branch, so keying on the ref alone would put every pull
# request's run and every push to `master` into a single queue, where GitHub keeps one
# pending run and cancels the rest — a pull request could then lose the run that was
# going to write its status. The number keeps them apart; `master` keeps its own key.
concurrency:
  group: mergeability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Named apart from the commit status this job writes, deliberately.
  #
  # Both used to be called `mergeability`, so both appeared in the checks rollup under
  # one name and no reader could tell which of them branch protection was satisfied by.
  # On #126 the job showed `pass` beside the status showing `pending` — the same word
  # reporting two different things about the same revision.
  #
  # `mergeability` is now exactly one thing: the commit status, and the required check.
  # This job is the machinery that writes it, and its own success says only that the
  # machinery ran.
  write-mergeability-status:
    name: write-mergeability-status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base branch on every event, which is the default and is load-bearing: a
      # `ref:` pointing at the pull request's head here would hand the judged revision
      # the token that writes the verdict. Full history: the ledger resolver below
      # merges `master` into a branch, and a shallow clone has no merge base to do it
      # from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The classifier, the two repair scripts this workflow runs, and the trust
      # boundary that keeps them master's — named, not discovered. Discovering the
      # whole suite here once ran a regression over the live ledger: when master carried
      # a merged row with no commit past the backfill's grace window, this step failed
      # on every pull request, the status below was never written, and the one pull
      # request able to repair master could not merge for want of it (#678). A claim
      # about master's state belongs in policy-guard, on the merge ref, where the repair
      # passes and everything else is honestly red. scripts/tests/test_mergeability_self_test
      # refuses `discover` here and keeps the list in step with the scripts this
      # workflow executes.
      - name: Prove the classifier fires
        working-directory: scripts/tests
        run: >-
          python -m unittest -v
          test_mergeability test_mergeability_trust
          test_update_branches test_resolve_ledger_conflicts

      # One pull request, the one the event is about. This step never fans out: the
      # event that carries a pull request's number has authority over that head only.
      - name: Status for this pull request
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/mergeability.py --repo "${{ github.repository }}" --pull "${PR_NUMBER}"

      # From `master` only, like the three steps below it. A `push` cannot arrive from
      # anywhere else now, but a `workflow_dispatch` can be started on any ref, and
      # from any other ref this definition and its scripts would be that ref's,
      # unreviewed, holding the credential that writes the required status on every
      # open pull request. `pull_request_target` is excluded by name because its
      # `github.ref` *is* `master`: the ref guard alone would let a pull request event
      # fan out.
      - name: Status for every open pull request, because the base moved
        if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/mergeability.py --repo "${{ github.repository }}" --all-open

      # `behind` is a red required check (#127), and its repair is a merge of the base
      # into the branch — a computation. Until now that computation cost a model run:
      # the AUTHOR's ladder picks up its own failing check and does the merge by hand.
      # The forge does it here instead, for the loop's own branches only; a conflict
      # (`dirty`) is still the author's.
      #
      # From `master` only. On a `workflow_dispatch` from any other ref this workflow's
      # definition and its scripts come from that ref, unreviewed, and this step
      # carries a credential that can push. `master` is the reviewed definition — and
      # `master` moving is exactly when branches fall behind.
      #
      # The MACHINE identity's token, not `github.token`: a push made with the workflow
      # token starts no workflows, so the updated branch would sit with the stale checks
      # it had before, measured on a revision that no longer exists. Minted for this
      # repository alone and revoked with the job (docs/adr/0006-github-apps-as-loop-
      # identities.md). A failed mint leaves the branch to the author and warns; it does
      # not paint master red.
      - name: Act as the MACHINE identity
        id: identity
        if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ZENDEV_MACHINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ZENDEV_MACHINE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Update loop branches that are merely behind
        if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::no MACHINE identity token; branches that are behind stay with the author"
            exit 0
          fi
          python scripts/update_branches.py --repo "${{ github.repository }}" --all-open

      # `dirty` is a conflict, and a conflict is the author's — except in the two files
      # the forge generates for every pull request, where it is the forge's own doing.
      # See scripts/resolve_ledger_conflicts.py; it refuses everything else, and every
      # refusal aborts its merge. Same guards as the sweep above: `master` only, the
      # reviewed definition, the MACHINE identity's token so the push is measured.
      - name: Resolve conflicts the forge itself created in the ledger
        if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::no MACHINE identity token; ledger conflicts stay with the author"
            exit 0
          fi
          git config user.name "zendev-machine[bot]"
          git config user.email "zendev-machine[bot]@users.noreply.github.com"
          python scripts/resolve_ledger_conflicts.py --repo "${{ github.repository }}" --all-open
